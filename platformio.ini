[platformio]
default_envs = crowpanel_advance_5_v1_1

[env:crowpanel_advance_5_v1_1]
platform = espressif32@6.13.0
board = elecrow_crowpanel_advance_5_v1_1
framework = espidf
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

; Separate build/configuration for an LVGL-only compiler optimization A/B test.
[env:crowpanel_advance_5_v1_1_o3]
extends = env:crowpanel_advance_5_v1_1
board_build.cmake_extra_args = -DAPP_LVGL_O3=ON
